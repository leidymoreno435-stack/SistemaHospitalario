<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">{{ isEditing ? 'Editar Consultorio' : 'Nuevo Consultorio' }}</h5>
                </div>

                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="guardar()">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="codigo" class="form-label">Código</label>
                                <input type="text" class="form-control" id="codigo" formControlName="codigo"
                                       placeholder="Ej: C-101" />
                                <small *ngIf="form.get('codigo')?.invalid && form.get('codigo')?.touched" class="text-danger">
                                    El código es obligatorio y de máximo 30 caracteres.
                                </small>
                            </div>
                            <div class="col-md-6">
                                <label for="piso" class="form-label">Piso</label>
                                <input type="number" class="form-control" id="piso" formControlName="piso"
                                       placeholder="Ej: 1" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Consultorio</label>
                            <input type="text" class="form-control" id="nombre" formControlName="nombre"
                                   placeholder="Ej: Consultorio de Pediatría" />
                            <small *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-danger">
                                El nombre es obligatorio.
                            </small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                                <i class="bi bi-check-circle"></i> {{ isEditing ? 'Actualizar' : 'Guardar' }}
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="volver()">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
