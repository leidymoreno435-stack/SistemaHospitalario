<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">{{ isEditing ? 'Editar Especialidad' : 'Nueva Especialidad' }}</h5>
                </div>

                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="guardar()">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de Especialidad</label>
                            <input type="text" class="form-control" id="nombre" formControlName="nombre"
                                   placeholder="Ej: Pediatría" />
                            <small *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="text-danger">
                                El nombre es obligatorio y debe tener máximo 100 caracteres.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" formControlName="descripcion"
                                      rows="3" placeholder="Descripción de la especialidad..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                                <i class="bi bi-check-circle"></i> {{ isEditing ? 'Actualizar' : 'Guardar' }}
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="volver()">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
