<div class="container" id="container">
    <div class="form-box register">
        <form action="#">
            <h2>Registrarse</h2>
            <div class="input-box">
                <input type="text" placeholder="Usuario" required>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Correo Electrónico" required>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            <button type="submit" class="btn">Registrarse</button>
        </form>
    </div>

    <div class="form-box login">
        <form action="#">
            <h2>Iniciar Sesión</h2>
            <div class="input-box">
                <input #usernameInput type="text" placeholder="Usuario" required>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
                <input #passwordInput type="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="forgot-link">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="button" (click)="iniciarSesion(usernameInput.value, passwordInput.value)" class="btn">Iniciar Sesión</button>
        </form>
    </div>

    <div class="toggle-box">
        <div class="toggle-panel toggle-left">
            <h1>¡Hola de nuevo!</h1>
            <p>¿Ya tienes una cuenta?</p>
            <button class="btn" id="login">Iniciar Sesión</button>
        </div>
        <div class="toggle-panel toggle-right">
            <h1>Bienvenido</h1>
            <p>¿Aún no tienes cuenta?</p>
            <button class="btn" id="register">Registrarse</button>
        </div>
    </div>
</div>
