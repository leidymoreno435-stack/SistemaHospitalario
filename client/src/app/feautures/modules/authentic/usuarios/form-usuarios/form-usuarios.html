<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">{{ isEditing ? 'Editar Usuario' : 'Nuevo Usuario' }}</h5>
                </div>

                <div class="card-body">
                    <form [formGroup]="form" (ngSubmit)="guardar()">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">Nombre de Usuario</label>
                                <input type="text" class="form-control" id="username" formControlName="username"
                                       placeholder="Ej: jdoe" />
                                <small *ngIf="form.get('username')?.invalid && form.get('username')?.touched" class="text-danger">
                                    El usuario es obligatorio y de máximo 80 caracteres.
                                </small>
                            </div>
                            <div class="col-md-6">
                                <label for="password_hash" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password_hash" formControlName="password_hash"
                                       [placeholder]="isEditing ? 'Dejar en blanco para no cambiar' : 'Requerido'" />
                                <small *ngIf="form.get('password_hash')?.invalid && form.get('password_hash')?.touched" class="text-danger">
                                    La contraseña es obligatoria para nuevos usuarios.
                                </small>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="id_rol" class="form-label">Rol del Usuario</label>
                                <select class="form-control" id="id_rol" formControlName="id_rol">
                                    <option value="">Seleccione un rol...</option>
                                    <option *ngFor="let rol of roles" [value]="rol.id_rol || rol.id">
                                        {{ rol.nombre }}
                                    </option>
                                </select>
                                <small *ngIf="form.get('id_rol')?.invalid && form.get('id_rol')?.touched" class="text-danger">
                                    Debe seleccionar un rol.
                                </small>
                            </div>
                            <div class="col-md-6 d-flex align-items-center mt-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="activo" formControlName="activo">
                                    <label class="form-check-label" for="activo">Usuario Activo</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                                <i class="bi bi-check-circle"></i> {{ isEditing ? 'Actualizar' : 'Guardar' }}
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="volver()">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
