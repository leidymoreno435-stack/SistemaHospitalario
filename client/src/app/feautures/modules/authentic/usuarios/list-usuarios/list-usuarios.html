<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Lista de Usuarios</h2>
        <div>
            <a routerLink="/home" class="btn btn-secondary me-2">
                <i class="bi bi-house"></i> Regresar al Home
            </a>
            <a routerLink="/nuevo-usuario" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Agregar Usuario
            </a>
        </div>
    </div>

    <div *ngIf="usuarios.length > 0; else sinRegistros" class="table-responsive">
        <table class="table table-hover table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Rol (ID)</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let usr of usuarios">
                    <td>{{ usr.id_usuario || usr.id }}</td>
                    <td>{{ usr.username }}</td>
                    <td>{{ usr.id_rol }}</td>
                    <td>
                        <span class="badge" [ngClass]="usr.activo ? 'bg-success' : 'bg-danger'">
                            {{ usr.activo ? 'Activo' : 'Inactivo' }}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary me-2" (click)="editarUsuario(usr.id_usuario || usr.id)">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(usr.id_usuario || usr.id)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <ng-template #sinRegistros>
        <div class="alert alert-info mt-3" role="alert">
            <i class="bi bi-info-circle"></i> No hay usuarios registrados.
        </div>
    </ng-template>
</div>
