<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Lista de Quirófanos</h2>
        <div>
            <a routerLink="/home" class="btn btn-secondary me-2">
                <i class="bi bi-house"></i> Regresar al Home
            </a>
            <a routerLink="/nuevo-quirofano" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Agregar Quirófano
            </a>
        </div>
    </div>

    <div *ngIf="quirofanos.length > 0; else sinRegistros" class="table-responsive">
        <table class="table table-hover table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Ubicación</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let q of quirofanos">
                    <td>{{ q.id_quirofano || q.id }}</td>
                    <td>{{ q.nombre || q.name }}</td>
                    <td>{{ q.ubicacion || q.location || '-' }}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-2" (click)="editarQuirofano(q.id_quirofano || q.id)">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="eliminarQuirofano(q.id_quirofano || q.id)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <ng-template #sinRegistros>
        <div class="alert alert-info mt-3" role="alert">
            <i class="bi bi-info-circle"></i> No hay quirófanos registrados.
        </div>
    </ng-template>
</div>
