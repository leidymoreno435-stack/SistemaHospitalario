<div class="card p-3">
  <h5 *ngIf="mode === 'add'">Agregar medicamento</h5>
  <h5 *ngIf="mode === 'edit'">Editar stock</h5>

  <form (ngSubmit)="save()">
    <div *ngIf="mode === 'add'">
      <div class="mb-2">
        <label class="form-label">Nombre</label>
        <input class="form-control" [(ngModel)]="model.nombre" name="nombre" required />
      </div>
      <div class="mb-2">
        <label class="form-label">Principio activo</label>
        <input class="form-control" [(ngModel)]="model.principio_activo" name="principio_activo" />
      </div>
      <div class="mb-2">
        <label class="form-label">Presentación</label>
        <input class="form-control" [(ngModel)]="model.presentacion" name="presentacion" />
      </div>
      <div class="mb-2">
        <label class="form-label">Precio</label>
        <input type="number" class="form-control" [(ngModel)]="model.precio_unitario" name="precio_unitario" />
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label">Stock</label>
      <input type="number" class="form-control" [(ngModel)]="model.stock" name="stock" required />
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
