<div class="card shadow border-0">
    <div class="card-header bg-success text-white">
        <h5 class="mb-0">{{ isEditing ? 'Editar Consulta' : 'Nueva Consulta' }}</h5>
    </div>

    <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="guardar()">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Paciente</label>
                    <select class="form-control" formControlName="IdPaciente">
                    <option value="">Seleccione un paciente</option>
                    <option *ngFor="let p of pacientes" [value]="p.id_paciente">
                        {{ p.nombres }} {{ p.apellidos }}
                    </option>
                    </select>

                    <small *ngIf="form.controls.IdPaciente.touched && form.controls.IdPaciente.invalid" class="text-danger">
                    Debe seleccionar un paciente
                    </small>
                </div>

                <div class="col-md-6">
                    <label>Medico</label>
                    <select class="form-control" formControlName="IdMedico">
                    <option value="">Seleccione un medico</option>
                    <option *ngFor="let m of medicos" [ngValue]="m.id_personal">
                        {{ m.nombres }} {{ m.apellidos }}
                    </option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Consultorio</label>
                    <select class="form-control" formControlName="IdConsultorio">
                    <option value="">Seleccione un consultorio</option>
                    <option *ngFor="let c of consultorios" [value]="c.id_consultorio">
                        {{c.codigo}}: {{c.nombre}}
                    </option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-8">
                    <label>Motivo</label>
                    <input type="text" class="form-control" formControlName="motivo" />
                    <small *ngIf="form.controls.motivo?.invalid && form.controls.motivo?.touched" class="text-danger">El motivo es obligatorio</small>
                </div>
            </div>

            <div class="mb-3">
                <label>Observaciones</label>
                <textarea class="form-control" formControlName="observaciones"></textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Estado</label>
                    <input type="text" class="form-control" formControlName="estado" />
                </div>

                <div class="col-md-4">
                    <label>Fecha Programada</label>
                    <input type="date" class="form-control" formControlName="fecha_programada" />
                </div>

                <div class="col-md-4">
                    <label>Fecha Realización</label>
                    <input type="date" class="form-control" formControlName="fecha_realizacion" />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Duración (min)</label>
                    <input type="number" class="form-control" formControlName="Duracion_min" />
                </div>

                <div class="col-md-4">
                    <label>Tarifa</label>
                    <input type="number" step="0.01" class="form-control" formControlName="Tarifa" />
                </div>

                <div class="col-md-4">
                    <label>Creado</label>
                    <input type="date" class="form-control" formControlName="Creado" />
                </div>
            </div>

            <button type="submit" class="btn btn-success" [disabled]="form.invalid">Guardar</button>
            <button type="button" class="btn btn-secondary ms-2" (click)="volver()">Volver</button>
        </form>
    </div>
</div>
