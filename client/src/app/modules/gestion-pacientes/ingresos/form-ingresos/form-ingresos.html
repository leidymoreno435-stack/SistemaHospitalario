<div class="card shadow border-0">
    <div class="card-header bg-success text-white">
        <h5 class="mb-0">{{ isEditing ? 'Editar Ingreso Hospitalario' : 'Nuevo Ingreso Hospitalario' }}</h5>
    </div>

    <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="guardar()">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Paciente</label>
                    <select class="form-control" formControlName="id_paciente">
                        <option value="">Seleccionar paciente...</option>
                        <option *ngFor="let paciente of pacientes" [value]="paciente.id_paciente">
                            {{ paciente.nombres }} {{ paciente.apellidos }}
                        </option>
                    </select>
                    <small *ngIf="form.controls.id_paciente?.invalid && form.controls.id_paciente?.touched" class="text-danger">
                        El paciente es obligatorio
                    </small>
                </div>

                <div class="col-md-6">
                    <label>Médico Responsable</label>
                    <select class="form-control" formControlName="id_medico_responsable">
                        <option value="">Seleccionar médico...</option>
                        <option *ngFor="let medico of personal" [value]="medico.id_personal">
                            {{ medico.nombres }} {{ medico.apellidos }}
                        </option>
                    </select>
                    <small *ngIf="form.controls.id_medico_responsable?.invalid && form.controls.id_medico_responsable?.touched" class="text-danger">
                        El médico responsable es obligatorio
                    </small>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Cama</label>
                    <select class="form-control" formControlName="id_cama">
                        <option value="">Seleccionar cama...</option>
                        <option *ngFor="let cama of camas" [value]="cama.id_cama">
                            Cama {{ cama.numero }} - Hab {{ cama.numero_habitacion }}
                        </option>
                    </select>
                    <small *ngIf="form.controls.id_cama?.invalid && form.controls.id_cama?.touched" class="text-danger">
                        La cama es obligatoria
                    </small>
                </div>

                <div class="col-md-6">
                    <label>Fecha de Ingreso</label>
                    <input type="date" class="form-control" formControlName="fecha_ingreso" />
                    <small *ngIf="form.controls.fecha_ingreso?.invalid && form.controls.fecha_ingreso?.touched" class="text-danger">
                        La fecha de ingreso es obligatoria
                    </small>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Fecha de Alta (Opcional)</label>
                    <input type="date" class="form-control" formControlName="fecha_alta" />
                </div>
            </div>

            <div class="mb-3">
                <label>Motivo de Ingreso</label>
                <textarea class="form-control" formControlName="motivo_ingreso" rows="3" placeholder="Describa el motivo del ingreso..."></textarea>
                <small *ngIf="form.controls.motivo_ingreso?.invalid && form.controls.motivo_ingreso?.touched" class="text-danger">
                    El motivo de ingreso es obligatorio
                </small>
            </div>

            <button class="btn btn-success" [disabled]="form.invalid">Guardar</button>
            <button class="btn btn-secondary ms-2" (click)="volver()">Volver</button>
        </form>
    </div>
</div>
