networks:
  hospital_net:
    driver: bridge

services:
  # ==================================
  # API GATEWAY
  # ==================================
  api-gateway:
    build: ./server/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./server/api-gateway:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospital_net
    depends_on:
      - ms-security
      - ms-patients
      - ms-personal
      - ms-clinical
      - ms-billing
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-super_secret_key_production_ready_99}
      - FRONTEND_URL=http://localhost:5173

  # ==================================
  # MICROSERVICIOS
  # ==================================
  ms-security:
    build: ./server/ms-security
    container_name: ms-security
    volumes:
      - ./server/ms-security:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./server/ms-security/.env
    networks:
      - hospital_net
    depends_on:
      postgres:
        condition: service_healthy

  ms-patients:
    build: ./server/ms-patients
    container_name: ms-patients
    volumes:
      - ./server/ms-patients:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospital_net
    depends_on:
      postgres:
        condition: service_healthy

  ms-personal:
    build: ./server/ms-personal
    container_name: ms-personal
    volumes:
      - ./server/ms-personal:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./server/ms-personal/.env
    networks:
      - hospital_net
    depends_on:
      postgres:
        condition: service_healthy

  ms-clinical:
    build: ./server/ms-clinical
    container_name: ms-clinical
    volumes:
      - ./server/ms-clinical:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospital_net
    depends_on:
      postgres:
        condition: service_healthy

  ms-billing:
    build: ./server/ms-billing
    container_name: ms-billing
    volumes:
      - ./server/ms-billing:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - hospital_net
    depends_on:
      postgres:
        condition: service_healthy

  # ==================================
  # FRONTEND
  # ==================================
  client:
    build: ./client
    container_name: client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - hospital_net
    depends_on:
      - api-gateway

  # ==================================
  # POSTGRES
  # ==================================
  postgres:
    image: postgres:16
    container_name: postgres-hospital
    restart: always
    networks:
      - hospital_net
    environment:
      POSTGRES_DB: SistemaHospitalario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Admi123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SistemaHospitalario"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SisHospital.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: