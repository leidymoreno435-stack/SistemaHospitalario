openapi: 3.0.0

info:
  title: API de Personal
  version: 1.0.0
  description: Contrato de API para la gestión del personal usando arquitectura hexagonal en Node.js.

servers:
  - url: http://localhost:3001/api/v1

tags:
  - name: Personal
    description: Operaciones relacionadas con el personal

paths:
  /personal:
    get:
      tags:
        - Personal
      summary: Listar personal
      description: Obtiene la lista del personal registrado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista del personal obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Personal'

    post:
      tags:
        - Personal
      summary: Crear personal
      description: Registra un nuevo integrante del personal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPersonalRequest'
      responses:
        '201':
          description: Personal creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personal'
        '400':
          description: Datos inválidos

  /personal/{id}:
    get:
      tags:
        - Personal
      summary: Buscar personal por ID
      description: Obtiene un integrante del personal mediante su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del personal
          schema:
            type: integer
      responses:
        '200':
          description: Personal encontrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personal'
        '404':
          description: Personal no encontrado

    put:
      tags:
        - Personal
      summary: Actualizar personal
      description: Actualiza la información de un integrante del personal.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del personal
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPersonalRequest'
      responses:
        '200':
          description: Personal actualizado correctamente
        '404':
          description: Personal no encontrado

    delete:
      tags:
        - Personal
      summary: Eliminar personal
      description: Elimina un integrante del personal mediante su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del personal
          schema:
            type: integer
      responses:
        '200':
          description: Personal eliminado correctamente
        '404':
          description: Personal no encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Personal:
      type: object
      properties:
        id:
          type: integer
          example: 1

        nombre:
          type: string
          example: Juan

        apellido:
          type: string
          example: Pérez

        identificacion:
          type: string
          example: "0701234567"

        idUsuario:
          type: integer
          example: 3

        idSpecialty:
          type: integer
          example: 2

        telefono:
          type: string
          example: "0999999999"

        email:
          type: string
          format: email
          example: juan@correo.com

        activo:
          type: boolean
          example: true

        creado_en:
          type: string
          format: date-time
          example: "2026-07-26T10:30:00Z"

    CrearPersonalRequest:
      type: object
      required:
        - nombre
        - apellido
        - identificacion
        - idUsuario
        - idSpecialty
        - telefono
        - email
      properties:
        nombre:
          type: string
          example: Juan

        apellido:
          type: string
          example: Pérez

        identificacion:
          type: string
          example: "0701234567"

        idUsuario:
          type: integer
          example: 3

        idSpecialty:
          type: integer
          example: 2

        telefono:
          type: string
          example: "0999999999"

        email:
          type: string
          format: email
          example: juan@correo.com

        activo:
          type: boolean
          example: true

    ActualizarPersonalRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Juan Carlos

        apellido:
          type: string
          example: Pérez Gómez

        identificacion:
          type: string
          example: "0701234567"

        idUsuario:
          type: integer
          example: 3

        idSpecialty:
          type: integer
          example: 2

        telefono:
          type: string
          example: "0988888888"

        email:
          type: string
          format: email
          example: juancarlos@correo.com

        activo:
          type: boolean
          example: false