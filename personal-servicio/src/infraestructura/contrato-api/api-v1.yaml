openapi: 3.0.0

info:
  title: API de Usuarios
  version: 1.0.0
  description: Contrato de API para la gestión de usuarios usando arquitectura hexagonal en Node.js.

servers:
  - url: http://localhost:3001/api/v1

tags:
  - name: Usuarios
    description: Operaciones relacionadas con usuarios

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesion
      description: Valida credenciales y retorna un JWT para acceso autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: Obtiene la lista de usuarios registrados.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'

    post:
      tags:
        - Usuarios
      summary: Crear usuario
      description: Registra un nuevo usuario en el sistema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos inválidos

  /usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Buscar usuario por ID
      description: Obtiene un usuario mediante su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del usuario
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          description: Usuario no encontrado

    put:
      tags:
        - Usuarios
      summary: Actualizar usuario
      description: Actualiza los datos de un usuario existente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del usuario
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado correctamente
        '404':
          description: Usuario no encontrado

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      description: Elimina un usuario mediante su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del usuario
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado correctamente
        '404':
          description: Usuario no encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - nombre
        - contrasena
      properties:
        nombre:
          type: string
          example: admin
        contrasena:
          type: string
          example: Admin1234!

    LoginResponse:
      type: object
      properties:
        estado:
          type: string
          example: ok
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tipo:
          type: string
          example: Bearer
        expiracion:
          type: string
          example: 15m
        usuario:
          type: object
          properties:
            id:
              type: string
              example: "1"
            nombre:
              type: string
              example: admin
            rol:
              type: string
              example: admin

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        correo:
          type: string
          example: juan@correo.com
        estado:
          type: string
          example: activo

    CrearUsuarioRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Juan
        
    ActualizarUsuarioRequest:
      type: object
      properties:
        nombre:
          type: string
          example: Juan Carlos
        apellido:
          type: string
          example: Pérez
        correo:
          type: string
          example: juancarlos@correo.com
        estado:
          type: string
          example: inactivo
