openapi: 3.0.0

info:
  title: API de Consultas
  version: 1.0.0
  description: Contrato de API para la gestión de consultas médicas usando arquitectura hexagonal en Node.js.

servers:
  - url: http://localhost:3002/api/v1

tags:
  - name: Consultas
    description: Operaciones relacionadas con la gestión de consultas médicas

paths:
  /consultas:

    get:
      tags:
        - Consultas
      summary: Listar o filtrar consultas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id_paciente
          schema:
            type: integer
          description: Filtrar consultas por ID del paciente
        - in: query
          name: id_medico
          schema:
            type: integer
          description: Filtrar consultas por ID del médico
        - in: query
          name: id_consultorio
          schema:
            type: integer
          description: Filtrar consultas por ID del consultorio
        - in: query
          name: estado
          schema:
            type: string
            enum: [PROGRAMADA, ATENDIDA, CANCELADA]
          description: Filtrar por estado de la consulta
        - in: query
          name: fecha_programada
          schema:
            type: string
            format: date-time
          description: Filtrar por fecha programada
      responses:
        '200':
          description: Lista de consultas obtenida correctamente

    post:
      tags:
        - Consultas
      summary: Agendar/Registrar consulta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearConsultaRequest'
      responses:
        '201':
          description: Consulta registrada correctamente

    put:
      tags:
        - Consultas
      summary: Actualizar consulta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarConsultaRequest'
      responses:
        '200':
          description: Consulta actualizada correctamente

    delete:
      tags:
        - Consultas
      summary: Eliminar consulta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminarConsultaRequest'
      responses:
        '200':
          description: Consulta eliminada correctamente

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Consulta:
      type: object
      properties:

        id_consulta:
          type: integer
          example: 1

        id_paciente:
          type: integer
          example: 10

        id_medico:
          type: integer
          example: 5

        id_consultorio:
          type: integer
          example: 2

        motivo:
          type: string
          example: "Dolor abdominal agudo"

        observaciones:
          type: string
          example: "Se prescribe tratamiento inicial y reposo"

        estado:
          type: string
          enum: [PROGRAMADA, ATENDIDA, CANCELADA]
          example: "PROGRAMADA"

        fecha_programada:
          type: string
          format: date-time
          example: "2026-08-01T09:00:00Z"

        fecha_realizacion:
          type: string
          format: date-time
          example: "2026-08-01T09:15:00Z"

        duracion_min:
          type: integer
          example: 30

        tarifa:
          type: number
          format: float
          example: 45.00

        creado_en:
          type: string
          format: date-time
          example: "2026-07-28T15:30:00Z"

    CrearConsultaRequest:
      type: object
      required:
        - id_paciente
        - id_medico
        - fecha_programada
      properties:

        id_paciente:
          type: integer
          example: 10

        id_medico:
          type: integer
          example: 5

        id_consultorio:
          type: integer
          example: 2

        motivo:
          type: string
          example: "Consulta de control rutina"

        observaciones:
          type: string
          example: "Paciente acude a chequeo preventivo"

        estado:
          type: string
          enum: [PROGRAMADA, ATENDIDA, CANCELADA]
          example: "PROGRAMADA"

        fecha_programada:
          type: string
          format: date-time
          example: "2026-08-01T09:00:00Z"

        duracion_min:
          type: integer
          example: 30

        tarifa:
          type: number
          format: float
          example: 45.00

    ActualizarConsultaRequest:
      type: object
      required:
        - id_consulta
      properties:

        id_consulta:
          type: integer
          example: 1

        id_paciente:
          type: integer
          example: 10

        id_medico:
          type: integer
          example: 5

        id_consultorio:
          type: integer
          example: 2

        motivo:
          type: string
          example: "Consulta de control rutina"

        observaciones:
          type: string
          example: "Consulta finalizada, paciente en buen estado"

        estado:
          type: string
          enum: [PROGRAMADA, ATENDIDA, CANCELADA]
          example: "ATENDIDA"

        fecha_programada:
          type: string
          format: date-time
          example: "2026-08-01T09:00:00Z"

        fecha_realizacion:
          type: string
          format: date-time
          example: "2026-08-01T09:15:00Z"

        duracion_min:
          type: integer
          example: 30

        tarifa:
          type: number
          format: float
          example: 45.00

    EliminarConsultaRequest:
      type: object
      required:
        - id_consulta
      properties:

        id_consulta:
          type: integer
          example: 1