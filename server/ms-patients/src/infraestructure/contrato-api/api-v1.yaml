openapi: 3.0.0

info:
  title: API de Pacientes
  version: 1.0.0
  description: Contrato de API para la gestión de pacientes usando arquitectura hexagonal en Node.js.

servers:
  - url: http://localhost:3002/api/v1

tags:
  - name: Patients
    description: Operaciones relacionadas con pacientes

paths:
  /patient:
    get:
      tags:
        - Patients
      summary: Listar pacientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pacientes obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '500':
          description: Error interno del servidor

    post:
      tags:
        - Patients
      summary: Registrar paciente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPacienteRequest'
      responses:
        '201':
          description: Paciente registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Datos requeridos faltantes o inválidos
        '500':
          description: Error interno del servidor

    delete:
      tags:
        - Patients
      summary: Eliminar paciente por cuerpo de petición (Body)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminarPacienteRequest'
      responses:
        '200':
          description: Paciente eliminado correctamente
        '404':
          description: Paciente no encontrado
        '500':
          description: Error interno del servidor

  /patient/{id}:
    get:
      tags:
        - Patients
      summary: Obtener paciente por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del paciente
          schema:
            type: integer
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Paciente no encontrado
        '500':
          description: Error interno del servidor

    patch:
      tags:
        - Patients
      summary: Actualizar paciente parcialmente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del paciente
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPacienteRequest'
      responses:
        '200':
          description: Paciente actualizado correctamente
        '404':
          description: Paciente no encontrado
        '500':
          description: Error interno del servidor

    delete:
      tags:
        - Patients
      summary: Eliminar paciente por ID en la URL
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del paciente
          schema:
            type: integer
      responses:
        '200':
          description: Paciente eliminado correctamente
        '404':
          description: Paciente no encontrado
        '500':
          description: Error interno del servidor

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Patient:
      type: object
      properties:
        id_paciente:
          type: integer
          example: 4
        nombres:
          type: string
          example: Juan
        apellidos:
          type: string
          example: Mendoza Ruiz
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-04-12"
        sexo:
          type: string
          example: "M"
        identificacion:
          type: string
          example: "1102345678"
        telefono:
          type: string
          example: "0982233445"
        email:
          type: string
          format: email
          example: "juan.mendoza@email.com"
        direccion:
          type: string
          example: "Av. América 123"
        creado_en:
          type: string
          format: date-time
          example: "2025-10-01T10:00:00Z"

    CrearPacienteRequest:
      type: object
      required:
        - nombres
        - apellidos
        - identificacion
      properties:
        nombres:
          type: string
          example: Juan
        apellidos:
          type: string
          example: Mendoza Ruiz
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-04-12"
        sexo:
          type: string
          example: "M"
        identificacion:
          type: string
          example: "1102345678"
        telefono:
          type: string
          example: "0982233445"
        email:
          type: string
          format: email
          example: "juan.mendoza@email.com"
        direccion:
          type: string
          example: "Av. América 123"

    ActualizarPacienteRequest:
      type: object
      properties:
        nombres:
          type: string
          example: Juan
        apellidos:
          type: string
          example: Mendoza Ruiz
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-04-12"
        sexo:
          type: string
          example: "M"
        identificacion:
          type: string
          example: "1102345678"
        telefono:
          type: string
          example: "0982233445"
        email:
          type: string
          format: email
          example: "juan.mendoza@email.com"
        direccion:
          type: string
          example: "Av. América 123"

    EliminarPacienteRequest:
      type: object
      required:
        - id_paciente
      properties:
        id_paciente:
          type: integer
          example: 4