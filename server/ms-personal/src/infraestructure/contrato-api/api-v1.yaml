openapi: 3.0.0

info:
  title: API de Personal y Especialidades
  version: 1.0.0
  description: Contrato de API para la gestión de personal y especialidades usando arquitectura hexagonal en Node.js.

servers:
  - url: http://localhost:3001/api/v1

tags:
  - name: Personal
    description: Operaciones relacionadas con la gestión de personal
  - name: Especialidades
    description: Operaciones relacionadas con la gestión de especialidades

paths:
  /personal:
    get:
      tags:
        - Personal
      summary: Listar o filtrar personal
      description: Obtiene la lista del personal registrado con opción de filtrado por query parameters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id_personal
          schema:
            type: integer
          description: ID del personal a buscar
        - in: query
          name: nombres
          schema:
            type: string
          description: Nombre o coincidencia parcial
        - in: query
          name: apellidos
          schema:
            type: string
          description: Apellido o coincidencia parcial
        - in: query
          name: identificacion
          schema:
            type: string
          description: Número de cédula o documento
        - in: query
          name: id_especialidad
          schema:
            type: integer
          description: ID de la especialidad asociada
        - in: query
          name: activo
          schema:
            type: boolean
          description: Estado activo/inactivo
      responses:
        '200':
          description: Lista de personal obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: array
                    items:
                      $ref: '#/components/schemas/Personal'
                  enlaces:
                    type: object
                    example:
                      post: "/personal"
                      patch: "/personal"
                      delete: "/personal"

    post:
      tags:
        - Personal
      summary: Crear personal
      description: Registra un nuevo integrante del personal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPersonalRequest'
      responses:
        '201':
          description: Personal creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se guardó con éxito en la BD: Pedro"
                  enlaces:
                    type: object
                    example:
                      get: "/personal"
                      patch: "/personal"
                      delete: "/personal"
        '400':
          description: Datos obligatorios faltantes o inválidos
        '409':
          description: Registro duplicado (cédula/identificación ya existente)

    patch:
      tags:
        - Personal
      summary: Actualizar personal
      description: Modifica la información de un integrante del personal existente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPersonalRequest'
      responses:
        '200':
          description: Personal actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Personal actualizado correctamente
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se actualizó con éxito el personal con ID: 1"
                  enlaces:
                    type: object
                    example:
                      get: "/personal"
                      delete: "/personal"
        '400':
          description: Datos inválidos o ID no proporcionado
        '404':
          description: Personal no encontrado
        '409':
          description: Conflicto de duplicidad en identificación

    delete:
      tags:
        - Personal
      summary: Eliminar personal
      description: Elimina un integrante del personal registrado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminarPersonalRequest'
      responses:
        '200':
          description: Personal eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Petición recibida correctamente
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se eliminó con éxito en la BD el ID: 1"
                  enlaces:
                    type: object
                    example:
                      get: "/personal"
                      post: "/personal"
        '404':
          description: Personal no encontrado

  /especialidad:
    get:
      tags:
        - Especialidades
      summary: Listar o filtrar especialidades
      description: Obtiene la lista de especialidades registradas con opción de filtrado por query parameters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id_especialidad
          schema:
            type: integer
          description: ID de la especialidad a buscar
        - in: query
          name: nombre
          schema:
            type: string
          description: Nombre de la especialidad o coincidencia parcial
        - in: query
          name: descripcion
          schema:
            type: string
          description: Descripción de la especialidad
      responses:
        '200':
          description: Lista de especialidades obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: array
                    items:
                      $ref: '#/components/schemas/Especialidad'
                  enlaces:
                    type: object
                    example:
                      post: "/especialidad"
                      patch: "/especialidad"
                      delete: "/especialidad"

    post:
      tags:
        - Especialidades
      summary: Crear especialidad
      description: Registra una nueva especialidad en el sistema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearEspecialidadRequest'
      responses:
        '201':
          description: Especialidad creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se guardó con éxito en la BD: Cardiología"
                  enlaces:
                    type: object
                    example:
                      get: "/especialidad"
                      patch: "/especialidad"
                      delete: "/especialidad"
        '400':
          description: Datos obligatorios faltantes o inválidos
        '409':
          description: Registro duplicado (nombre de especialidad ya existente)

    patch:
      tags:
        - Especialidades
      summary: Actualizar especialidad
      description: Modifica la información de una especialidad existente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEspecialidadRequest'
      responses:
        '200':
          description: Especialidad actualizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Especialidad actualizada correctamente
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se actualizó con éxito la especialidad con ID: 1"
                  enlaces:
                    type: object
                    example:
                      get: "/especialidad"
                      delete: "/especialidad"
        '400':
          description: Datos inválidos o ID no proporcionado
        '404':
          description: Especialidad no encontrada
        '409':
          description: Conflicto de duplicidad en el nombre de la especialidad

    delete:
      tags:
        - Especialidades
      summary: Eliminar especialidad
      description: Elimina una especialidad registrada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminarEspecialidadRequest'
      responses:
        '200':
          description: Especialidad eliminada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Petición recibida correctamente
                  traceId:
                    type: string
                    example: "req-12345"
                  resultado:
                    type: string
                    example: "Se eliminó con éxito en la BD el ID: 1"
                  enlaces:
                    type: object
                    example:
                      get: "/especialidad"
                      post: "/especialidad"
        '404':
          description: Especialidad no encontrada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Personal:
      type: object
      properties:
        id_personal:
          type: integer
          example: 1
        nombres:
          type: string
          example: Pedro
        apellidos:
          type: string
          example: González
        identificacion:
          type: string
          example: "1712345678"
        id_usuario:
          type: integer
          example: 1
        id_especialidad:
          type: integer
          nullable: true
          example: 25
        telefono:
          type: string
          example: "0991234567"
        email:
          type: string
          format: email
          example: pedro.admin@hospital.com
        activo:
          type: boolean
          example: true
        creado_en:
          type: string
          format: date-time
          example: "2025-11-06T11:00:00.000Z"

    CrearPersonalRequest:
      type: object
      required:
        - nombres
        - apellidos
        - identificacion
      properties:
        nombres:
          type: string
          example: Pedro
        apellidos:
          type: string
          example: González
        identificacion:
          type: string
          example: "1712345678"
        id_usuario:
          type: integer
          example: 1
        id_especialidad:
          type: integer
          example: 25
        telefono:
          type: string
          example: "0991234567"
        email:
          type: string
          format: email
          example: pedro.admin@hospital.com
        activo:
          type: boolean
          example: true

    ActualizarPersonalRequest:
      type: object
      required:
        - id_personal
      properties:
        id_personal:
          type: integer
          example: 1
        nombres:
          type: string
          example: Pedro
        apellidos:
          type: string
          example: González
        identificacion:
          type: string
          example: "1712345678"
        id_usuario:
          type: integer
          example: 1
        id_especialidad:
          type: integer
          example: 25
        telefono:
          type: string
          example: "0991234567"
        email:
          type: string
          format: email
          example: pedro.admin@hospital.com
        activo:
          type: boolean
          example: true

    EliminarPersonalRequest:
      type: object
      required:
        - id_personal
      properties:
        id_personal:
          type: integer
          example: 1

    Especialidad:
      type: object
      properties:
        id_especialidad:
          type: integer
          example: 1
        nombre:
          type: string
          example: Cardiología
        descripcion:
          type: string
          example: Especialidad encargada de las enfermedades del corazón y del sistema circulatorio.

    CrearEspecialidadRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Cardiología
        descripcion:
          type: string
          example: Especialidad encargada de las enfermedades del corazón y del sistema circulatorio.

    ActualizarEspecialidadRequest:
      type: object
      required:
        - id_especialidad
      properties:
        id_especialidad:
          type: integer
          example: 1
        nombre:
          type: string
          example: Cardiología Clínica
        descripcion:
          type: string
          example: Especialidad encargada del diagnóstico y tratamiento de enfermedades cardíacas.

    EliminarEspecialidadRequest:
      type: object
      required:
        - id_especialidad
      properties:
        id_especialidad:
          type: integer
          example: 1